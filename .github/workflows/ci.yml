# Mirror the Makefile's lint and test targets. Integration tests stay local
# (`make test-integration`): they need the emulators and WordPress.
# A push to main that passes deploys to the VPS (T-048).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # main queues instead, so a new push never stops a deploy halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      # uv picks Python from server/.python-version.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pytest -m "not integration"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder

  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
        working-directory: server
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: make gen-api
      # Fails when the server's API changed and the types weren't regenerated.
      - run: git diff --exit-code web/lib/api/

  deploy:
    needs: [server, web, api-types]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/ifindev/content-importer-adaptify-api:${{ github.sha }}
      WEB_IMAGE: ghcr.io/ifindev/content-importer-adaptify-web:${{ github.sha }}
      VPS: ${{ vars.VPS_SSH }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build --target prod -t "$API_IMAGE" server
          docker push "$API_IMAGE"
      # NEXT_PUBLIC_* are inlined into the browser bundle at build time.
      - run: |
          docker build --target prod -t "$WEB_IMAGE" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} \
            web
          docker push "$WEB_IMAGE"
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # ssh and scp below both read the VPS's SSH port from here.
          printf 'Port %s\n' "${{ vars.VPS_PORT || '22' }}" > ~/.ssh/config
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp infra/app/docker-compose.yml "$VPS:app/docker-compose.yml"
          # The token goes over stdin so it never shows in the VPS process list.
          # It expires when this job ends; the logout below drops it anyway.
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          # IMAGE_TAG is recorded in .env after a good start, so a plain
          # `docker compose up -d` on the VPS keeps running this version.
          ssh "$VPS" "cd app && export IMAGE_TAG=${{ github.sha }} \
            && docker compose pull && docker compose up -d --remove-orphans \
            && sed -i '/^IMAGE_TAG=/d' .env && echo IMAGE_TAG=\$IMAGE_TAG >> .env; \
            status=\$?; docker logout ghcr.io; docker image prune -af --filter until=168h; exit \$status"
