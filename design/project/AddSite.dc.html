<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add site</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:oklch(0.145 0 0);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;box-sizing:border-box;border-radius:8px;font-family:inherit;font-size:13px;font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer}
.icon-btn{padding:0;width:32px;height:32px}
.btn-primary{background:oklch(0.488 0.243 264.376);color:oklch(1 0 0);border:1px solid oklch(0.44 0.22 264.376);box-shadow:inset 0 1px 0 oklch(1 0 0 / 0.14),0 1px 2px oklch(0 0 0 / 0.1)}
.btn-primary:hover{background:oklch(0.45 0.225 264.376)}
.btn-outline{background:oklch(1 0 0);color:oklch(0.145 0 0);border:1px solid oklch(0.93 0.006 264);box-shadow:0 1px 2px oklch(0 0 0 / 0.04)}
.btn-outline:hover{background:oklch(0.975 0 0)}
.btn-ghost{background:transparent;color:oklch(0.45 0 0);border:1px solid transparent}
.btn-ghost:hover{background:oklch(0.96 0 0);color:oklch(0.145 0 0)}
.input{width:100%;height:36px;box-sizing:border-box;padding:0 11px;border:1px solid oklch(0.93 0.006 264);border-radius:8px;background:oklch(1 0 0);font-family:inherit;font-size:13.5px;color:oklch(0.145 0 0);box-shadow:0 1px 2px oklch(0 0 0 / 0.03)}
.input::placeholder{color:oklch(0.62 0 0)}
.input:focus{outline:none;border-color:oklch(0.488 0.243 264.376 / 0.5);box-shadow:0 0 0 3px oklch(0.488 0.243 264.376 / 0.12)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:13px;font-weight:500}
.hint{font-size:12.5px;color:oklch(0.556 0 0)}
.muted{color:oklch(0.556 0 0)}
</style>
</helmet>
<div class="app" style="position: relative; width: 100%; min-height: 840px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 24px; background: oklch(0.98 0 0);">

  <div aria-hidden="true" style="position: absolute; inset: 0; background: oklch(0.145 0 0 / 0.32);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="add-site-title" aria-describedby="add-site-desc" style="position: relative; width: 100%; max-width: 480px; background: oklch(1 0 0); border-radius: 14px; box-shadow: 0 24px 48px -12px oklch(0 0 0 / 0.25), 0 0 0 1px oklch(0 0 0 / 0.06);">

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 0 24px;">
      <div>
        <h2 id="add-site-title" style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;">Add a client site</h2>
        <p id="add-site-desc" class="muted" style="margin: 4px 0 0; font-size: 13.5px;">We check the WordPress connection before saving.</p>
      </div>
      <a href="Sites.dc.html" class="btn btn-ghost icon-btn" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </a>
    </div>

    <form style="padding: 20px 24px 22px; display: flex; flex-direction: column; gap: 16px;">
      <div role="alert" style="display: flex; gap: 10px; padding: 10px 12px; border-radius: 9px; background: oklch(0.97 0.015 27.325); border: 1px solid oklch(0.91 0.045 27.325);">
        <svg style="flex: 0 0 auto; margin-top: 2px;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.22 27.325)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span style="font-size: 13px; line-height: 1.45; color: oklch(0.42 0.17 27.325);">Couldn't connect to WordPress with these details — check the URL and app password.</span>
      </div>

      <label class="field">
        <span class="label">Site name</span>
        <input class="input" type="text" value="Lumen Yoga Studio">
      </label>

      <label class="field">
        <span class="label">WordPress URL</span>
        <input class="input" type="url" value="https://lumen-yoga.studio">
        <span class="hint">The site's home address, starting with https://</span>
      </label>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <label class="field">
          <span class="label">WordPress username</span>
          <input class="input" type="text" autocomplete="off" value="lumen-admin">
        </label>
        <label class="field">
          <span class="label">Application password</span>
          <span style="position: relative; display: block;">
            <input class="input" type="password" autocomplete="off" value="abcd efgh ijkl mnop qrst uvwx" style="padding-right: 38px;">
            <button type="button" class="btn btn-ghost icon-btn" aria-label="Show password" style="position: absolute; right: 2px; top: 2px; width: 32px; height: 32px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </label>
      </div>
      <span class="hint" style="margin-top: -8px;">Create one in WordPress under Users → Profile → Application Passwords.</span>
    </form>

    <div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px 14px 24px; border-top: 1px solid oklch(0.93 0.006 264); background: oklch(0.985 0 0); border-radius: 0 0 14px 14px;">
      <button type="button" class="btn btn-outline">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>
        Test connection
      </button>
      <div style="flex: 1 1 auto;"></div>
      <a href="Sites.dc.html" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Add site</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":840}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
