<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:oklch(0.145 0 0);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;box-sizing:border-box;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:500;line-height:1;white-space:nowrap;cursor:pointer}
.btn-primary{background:oklch(0.488 0.243 264.376);color:oklch(1 0 0);border:1px solid oklch(0.44 0.22 264.376);box-shadow:inset 0 1px 0 oklch(1 0 0 / 0.14),0 1px 2px oklch(0 0 0 / 0.1)}
.btn-primary:hover{background:oklch(0.45 0.225 264.376)}
.input{height:36px;box-sizing:border-box;padding:0 11px;border:1px solid oklch(0.93 0.006 264);border-radius:8px;background:oklch(1 0 0);font-family:inherit;font-size:14px;color:oklch(0.145 0 0);box-shadow:0 1px 2px oklch(0 0 0 / 0.03)}
.input:focus{outline:none;border-color:oklch(0.488 0.243 264.376 / 0.5);box-shadow:0 0 0 3px oklch(0.488 0.243 264.376 / 0.12)}
.label{font-size:13px;font-weight:500}
.muted{color:oklch(0.556 0 0)}
</style>
</helmet>
<div class="app" style="width: 100%; min-height: 840px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 24px; background: oklch(0.98 0 0);">
  <div style="width: 100%; max-width: 360px;">

    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px;">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: oklch(0.145 0 0); display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(1 0 0)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </span>
      <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em;">Sign in to Content Importer</h1>
      <p class="muted" style="margin: 4px 0 0; font-size: 13.5px;">Use your agency account</p>
    </div>

    <form style="background: oklch(1 0 0); border: 1px solid oklch(0.93 0.006 264); border-radius: 12px; box-shadow: 0 1px 3px oklch(0 0 0 / 0.05); padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span class="label">Email</span>
        <input class="input" type="email" autocomplete="email" value="agency@example.test">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span class="label">Password</span>
        <input class="input" type="password" autocomplete="current-password" value="wrongpassword" aria-invalid="true" aria-describedby="login-error" style="border-color: oklch(0.8 0.08 27.325);">
        <span id="login-error" style="display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: oklch(0.5 0.22 27.325);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          Incorrect email or password
        </span>
      </label>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 4px;">Sign in</button>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":840}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
