<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:oklch(0.145 0 0);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.nav-item{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:7px;color:oklch(0.45 0 0);text-decoration:none;font-size:13.5px;font-weight:500}
.nav-item svg{color:oklch(0.62 0 0)}
.nav-item.on{background:oklch(1 0 0);color:oklch(0.145 0 0);box-shadow:0 0 0 1px oklch(0.93 0.006 264),0 1px 2px oklch(0 0 0 / 0.05)}
.nav-item.on svg{color:oklch(0.145 0 0)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;box-sizing:border-box;border-radius:8px;font-family:inherit;font-size:13px;font-weight:500;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer}
.btn-sm{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px}
.icon-btn{padding:0;width:32px}
.btn-outline{background:oklch(1 0 0);color:oklch(0.145 0 0);border:1px solid oklch(0.93 0.006 264);box-shadow:0 1px 2px oklch(0 0 0 / 0.04)}
.btn-ghost{background:transparent;color:oklch(0.45 0 0);border:1px solid transparent}
.input{height:30px;box-sizing:border-box;padding:0 10px 0 30px;border:1px solid oklch(0.93 0.006 264);border-radius:7px;background:oklch(1 0 0);font-family:inherit;font-size:13px;color:oklch(0.145 0 0)}
.input::placeholder{color:oklch(0.62 0 0)}
.mlabel{padding:6px 8px 4px;font-size:11.5px;font-weight:500;color:oklch(0.556 0 0)}
.mitem{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 8px;box-sizing:border-box;border:none;border-radius:6px;background:transparent;font-family:inherit;font-size:13px;color:oklch(0.145 0 0);text-decoration:none;text-align:left;cursor:pointer}
.mitem:hover,.mitem.hl{background:oklch(0.96 0 0)}
.mav{width:20px;height:20px;border-radius:5px;background:oklch(0.94 0 0);color:oklch(0.35 0 0);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.skel{background:oklch(0.955 0 0);border-radius:6px}
</style>
</helmet>
<div class="app" style="width: 100%; min-height: 840px; box-sizing: border-box; display: flex; flex-wrap: wrap; background: oklch(0.98 0 0);">

      Report

    <div style="flex: 1 1 auto;"></div>

    <div style="display: flex; align-items: center; gap: 9px; padding: 12px 4px 2px 8px; border-top: 1px solid oklch(0.93 0.006 264);">

      <label style="position: relative; display: block; padding: 2px 2px 6px;">
        <svg style="position: absolute; left: 11px; top: 9px;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0 0)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" type="search" aria-label="Find a site" placeholder="Find a site" style="width: 100%;">
      </label>
      <div class="mlabel">Sites</div>
      <a href="Main.dc.html" role="menuitemradio" aria-checked="true" class="mitem hl">
        <span class="mav">A</span>
        <span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">acme-running.com</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.145 0 0)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>

      <div style="height: 1px; background: oklch(0.93 0.006 264); margin: 6px -6px;"></div>
      <a href="Sites.dc.html" role="menuitem" class="mitem" style="color: oklch(0.35 0 0);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.556 0 0)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>

        Add site

  </aside>

  <main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; margin: 8px 8px 8px 0; box-sizing: border-box; background: oklch(1 0 0); border: 1px solid oklch(0.93 0.006 264); border-radius: 12px; box-shadow: 0 1px 3px oklch(0 0 0 / 0.04); padding: 22px 28px; display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em;">Articles</h1>
    <div class="skel" style="width: 120px; height: 12px;"></div>
    <div style="display: flex; gap: 8px; margin: 10px 0 6px;"><div class="skel" style="width: 260px; height: 32px;"></div><div class="skel" style="width: 120px; height: 32px;"></div></div>
