services:
  api:
    build:
      context: ./server
      target: dev
    env_file: .env
    environment:
      # Fixed service-to-service URL; overrides WP_BASE_URL from .env
      # (that value is for the non-Docker `make test-integration` path,
      # which runs on the host and reaches WordPress via localhost:8080).
      WP_BASE_URL: http://wordpress
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - server-venv:/app/.venv
    depends_on:
      - firebase

  firebase:
    build: ./infra/firebase
    # firebase-tools only runs its --export-on-exit hook on SIGINT, not SIGTERM
    # (what `docker stop` sends by default).
    stop_signal: SIGINT
    ports:
      - "4000:4000"
      - "8081:8081"
      - "9099:9099"
    volumes:
      - firebase-data:/data

  web:
    build:
      context: ./web
      target: dev
    env_file: .env
    environment:
      # Fixed service-to-service URL; overrides whatever API_URL is in .env
      # (that value is for the non-Docker `make api`/`make web` path).
      API_URL: http://api:8000
      # NEXT_PUBLIC_* vars must reach the Next.js dev process to be inlined
      # into the browser bundle; env_file alone doesn't guarantee that here.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

  mariadb:
    image: mariadb:11
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6-apache
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
    ports:
      - "8080:80"
    volumes:
      - wordpress-data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy

  wp-cli:
    image: wordpress:cli
    profiles: ["tools"] # never starts with `make up`; only via `docker compose run`
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - wordpress-data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  server-venv:
  web-node-modules:
  firebase-data:
  mariadb-data:
  wordpress-data:
