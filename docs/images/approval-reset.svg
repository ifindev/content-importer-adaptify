<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Editing an approved article resets it to Draft, so the client approves the exact text that goes live">
<style>
:root{--changes:#fef3c7;--bg:#fff;--fg:oklch(0.145 0 0);--muted:oklch(0.556 0 0);--faint:oklch(0.8 0 0);--border:oklch(0.93 0.006 264);--line:oklch(0.955 0.003 264);--card:#fff;--primary:oklch(0.488 0.243 264.376);--primary-fg:#fff;
--draft:oklch(0.955 0 0);--draft-fg:oklch(0.45 0 0);--awaiting:#eff6ff;--awaiting-fg:#1d4ed8;--approved:#ecfdf5;--approved-fg:#047857;--scheduled:oklch(0.94 0.035 300);--scheduled-fg:oklch(0.42 0.18 300);--published:oklch(0.93 0.05 180);--published-fg:oklch(0.4 0.09 180)}
@media (prefers-color-scheme: dark){:root{--changes:oklch(0.38 0.07 85);--bg:oklch(0.16 0 0);--fg:oklch(0.985 0 0);--muted:oklch(0.708 0 0);--faint:oklch(0.4 0 0);--border:oklch(0.3 0 0);--line:oklch(0.26 0 0);--card:oklch(0.205 0 0);--primary:oklch(0.62 0.2 264);
--draft:oklch(0.269 0 0);--draft-fg:oklch(0.85 0 0);--awaiting:oklch(0.3 0.08 264);--awaiting-fg:oklch(0.85 0.08 264);--approved:oklch(0.3 0.06 160);--approved-fg:oklch(0.85 0.1 160);--scheduled:oklch(0.3 0.08 300);--scheduled-fg:oklch(0.85 0.1 300);--published:oklch(0.3 0.05 180);--published-fg:oklch(0.85 0.08 180)}}

text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg);stroke:var(--border)} .card{fill:var(--card);stroke:var(--border)}
.h{fill:var(--fg);font-weight:600} .m{fill:var(--muted)} .ln{fill:var(--line)}
.edit{fill:var(--changes,#fde68a);transform-box:fill-box;transform-origin:left center;animation:type 11s steps(12,end) infinite}
.caret{fill:var(--primary);animation:caret 11s linear infinite}
.rail{stroke:var(--border);stroke-width:2}
@keyframes type{0%,24%{transform:scaleX(0)}38%,100%{transform:scaleX(1)}}
@keyframes caret{0%,22%{opacity:0}23%,40%{opacity:1}41%,100%{opacity:0}}
@keyframes b0{0%,40%{opacity:1}41%,100%{opacity:0}}
.b0{animation:b0 11s linear infinite}
@keyframes b1{0%,40%{opacity:0}41%,52%{opacity:1}53%,100%{opacity:0}}
.b1{animation:b1 11s linear infinite}
@keyframes b2{0%,52%{opacity:0}53%,72%{opacity:1}73%,100%{opacity:0}}
.b2{animation:b2 11s linear infinite}
@keyframes b3{0%,72%{opacity:0}73%,97%{opacity:1}100%{opacity:0}}
.b3{animation:b3 11s linear infinite}
@keyframes e0{0%,0%{opacity:1;transform:translateY(0px)}0%,96%{opacity:1;transform:translateY(0)}99%,100%{opacity:1}}
.e0{animation:e0 11s ease-out infinite}
@keyframes e1{0%,40%{opacity:0;transform:translateY(8px)}43%,96%{opacity:1;transform:translateY(0)}99%,100%{opacity:0}}
.e1{animation:e1 11s ease-out infinite}
@keyframes e2{0%,52%{opacity:0;transform:translateY(8px)}55%,96%{opacity:1;transform:translateY(0)}99%,100%{opacity:0}}
.e2{animation:e2 11s ease-out infinite}
@keyframes e3{0%,72%{opacity:0;transform:translateY(8px)}75%,96%{opacity:1;transform:translateY(0)}99%,100%{opacity:0}}
.e3{animation:e3 11s ease-out infinite}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="299" rx="16"/>
<rect class="card" x="32" y="40" width="330" height="220" rx="12"/>
<text class="h" x="52" y="74" font-size="15">Roof Repair vs Replacement</text>
<g class="b0"><rect x="52" y="88" width="75" height="20" rx="10" style="fill:var(--approved)"/><text x="89" y="102" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:var(--approved-fg)">Approved</text></g>
<g class="b1"><rect x="52" y="88" width="55" height="20" rx="10" style="fill:var(--draft)"/><text x="80" y="102" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:var(--draft-fg)">Draft</text></g>
<g class="b2"><rect x="52" y="88" width="134" height="20" rx="10" style="fill:var(--awaiting)"/><text x="119" y="102" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:var(--awaiting-fg)">Awaiting approval</text></g>
<g class="b3"><rect x="52" y="88" width="75" height="20" rx="10" style="fill:var(--approved)"/><text x="89" y="102" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:var(--approved-fg)">Approved</text></g>
<rect class="ln" x="52" y="132" width="290" height="7" rx="3.5"/>
<rect class="ln" x="52" y="148" width="270" height="7" rx="3.5"/>
<rect class="ln" x="52" y="164" width="284" height="7" rx="3.5"/>
<rect class="ln" x="52" y="180" width="120" height="7" rx="3.5"/>
<rect class="edit" x="176" y="177" width="146" height="13" rx="3"/>
<rect class="caret" x="324" y="176" width="2" height="15"/>
<rect class="ln" x="52" y="196" width="276" height="7" rx="3.5"/>
<rect class="ln" x="52" y="212" width="230" height="7" rx="3.5"/>
<text class="m" x="400" y="48" font-size="12" font-weight="600" letter-spacing="0.5">ACTIVITY</text>
<line class="rail" x1="410" y1="74" x2="410" y2="248"/>
<g class="e0"><circle cx="410" cy="74" r="7" style="fill:var(--approved);stroke:var(--approved-fg);stroke-width:1.5"/><text class="h" x="430" y="79" font-size="14">Approved by Sarah</text><text class="m" x="430" y="98" font-size="12.5">Version 3 · the text she read</text></g>
<g class="e1"><circle cx="410" cy="132" r="7" style="fill:var(--draft);stroke:var(--draft-fg);stroke-width:1.5"/><text class="h" x="430" y="137" font-size="14">Edited by the agency</text><text class="m" x="430" y="156" font-size="12.5">Approval reset, back to Draft</text></g>
<g class="e2"><circle cx="410" cy="190" r="7" style="fill:var(--awaiting);stroke:var(--awaiting-fg);stroke-width:1.5"/><text class="h" x="430" y="195" font-size="14">Sent for review</text><text class="m" x="430" y="214" font-size="12.5">Same review link, new version</text></g>
<g class="e3"><circle cx="410" cy="248" r="7" style="fill:var(--approved);stroke:var(--approved-fg);stroke-width:1.5"/><text class="h" x="430" y="253" font-size="14">Approved by Sarah</text><text class="m" x="430" y="272" font-size="12.5">Version 4 · exactly what goes live</text></g>
</svg>