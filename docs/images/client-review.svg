<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="On a phone, the client opens the review link, reads the article and taps Approve">
<style>
:root{--bg:#fff;--fg:oklch(0.145 0 0);--muted:oklch(0.556 0 0);--faint:oklch(0.8 0 0);--border:oklch(0.93 0.006 264);--line:oklch(0.955 0.003 264);--card:#fff;--primary:oklch(0.488 0.243 264.376);--primary-fg:#fff;
--draft:oklch(0.955 0 0);--draft-fg:oklch(0.45 0 0);--awaiting:#eff6ff;--awaiting-fg:#1d4ed8;--approved:#ecfdf5;--approved-fg:#047857;--scheduled:oklch(0.94 0.035 300);--scheduled-fg:oklch(0.42 0.18 300);--published:oklch(0.93 0.05 180);--published-fg:oklch(0.4 0.09 180)}
@media (prefers-color-scheme: dark){:root{--bg:oklch(0.16 0 0);--fg:oklch(0.985 0 0);--muted:oklch(0.708 0 0);--faint:oklch(0.4 0 0);--border:oklch(0.3 0 0);--line:oklch(0.26 0 0);--card:oklch(0.205 0 0);--primary:oklch(0.62 0.2 264);
--draft:oklch(0.269 0 0);--draft-fg:oklch(0.85 0 0);--awaiting:oklch(0.3 0.08 264);--awaiting-fg:oklch(0.85 0.08 264);--approved:oklch(0.3 0.06 160);--approved-fg:oklch(0.85 0.1 160);--scheduled:oklch(0.3 0.08 300);--scheduled-fg:oklch(0.85 0.1 300);--published:oklch(0.3 0.05 180);--published-fg:oklch(0.85 0.08 180)}}

text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg);stroke:var(--border)} .frame{fill:var(--card);stroke:var(--border);stroke-width:1.5}
.notch{fill:var(--border)} .h{fill:var(--fg);font-weight:600} .m{fill:var(--muted)} .ln{fill:var(--line)}
.row{fill:var(--card);stroke:var(--border)} .btn{fill:var(--primary)} .btnt{fill:var(--primary-fg);font-weight:600}
.obtn{fill:var(--card);stroke:var(--border)} .bar{fill:var(--card);stroke:var(--border)}
.toast{fill:var(--fg)} .toastt{fill:var(--bg);font-weight:500}
.capn{fill:var(--muted);font-size:15px} .num{fill:var(--bg);stroke:var(--border);stroke-width:1.5} .numt{fill:var(--muted);font-size:12px;font-weight:600}
@keyframes A{0%,27%{opacity:1}30%,97%{opacity:0}100%{opacity:1}}
@keyframes B{0%,28%{opacity:0}31%,68%{opacity:1}71%,100%{opacity:0}}
@keyframes C{0%,69%{opacity:0}72%,96%{opacity:1}99%,100%{opacity:0}}
@keyframes tap{0%,56%{opacity:0;r:4px}58%{opacity:.5;r:6px}64%{opacity:0;r:26px}100%{opacity:0}}
@keyframes scroll{0%,32%{transform:translateY(0)}50%,100%{transform:translateY(-40px)}}
@keyframes toast{0%,72%{transform:translateY(16px);opacity:0}76%,94%{transform:translateY(0);opacity:1}98%,100%{opacity:0}}
.A{animation:A 10s linear infinite} .B{animation:B 10s linear infinite} .C{animation:C 10s linear infinite}
.tap{fill:var(--primary);animation:tap 10s ease-out infinite} .scroll{animation:scroll 10s ease-in-out infinite}
.toastg{animation:toast 10s ease-out infinite}
@keyframes k0{0%,0%{fill:var(--muted);font-weight:400}0%,28%{fill:var(--fg);font-weight:600}30%,100%{fill:var(--muted);font-weight:400}}
.k0{animation:k0 10s linear infinite}
@keyframes n0{0%,0%{fill:var(--bg);stroke:var(--border)}0%,28%{fill:var(--primary);stroke:var(--primary)}30%,100%{fill:var(--bg);stroke:var(--border)}}
.n0{animation:n0 10s linear infinite}
@keyframes t0{0%,0%{fill:var(--muted)}0%,28%{fill:var(--primary-fg)}30%,100%{fill:var(--muted)}}
.t0{animation:t0 10s linear infinite}
@keyframes k1{0%,29%{fill:var(--muted);font-weight:400}31%,68%{fill:var(--fg);font-weight:600}70%,100%{fill:var(--muted);font-weight:400}}
.k1{animation:k1 10s linear infinite}
@keyframes n1{0%,29%{fill:var(--bg);stroke:var(--border)}31%,68%{fill:var(--primary);stroke:var(--primary)}70%,100%{fill:var(--bg);stroke:var(--border)}}
.n1{animation:n1 10s linear infinite}
@keyframes t1{0%,29%{fill:var(--muted)}31%,68%{fill:var(--primary-fg)}70%,100%{fill:var(--muted)}}
.t1{animation:t1 10s linear infinite}
@keyframes k2{0%,69%{fill:var(--muted);font-weight:400}71%,97%{fill:var(--fg);font-weight:600}99%,100%{fill:var(--muted);font-weight:400}}
.k2{animation:k2 10s linear infinite}
@keyframes n2{0%,69%{fill:var(--bg);stroke:var(--border)}71%,97%{fill:var(--primary);stroke:var(--primary)}99%,100%{fill:var(--bg);stroke:var(--border)}}
.n2{animation:n2 10s linear infinite}
@keyframes t2{0%,69%{fill:var(--muted)}71%,97%{fill:var(--primary-fg)}99%,100%{fill:var(--muted)}}
.t2{animation:t2 10s linear infinite}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="499" rx="16"/>
<rect class="frame" x="70" y="24" width="232" height="452" rx="34"/>
<rect class="notch" x="150.0" y="36" width="72" height="8" rx="4"/>
<clipPath id="scr"><rect x="82" y="64" width="208" height="396"/></clipPath><g clip-path="url(#scr)">
<g class="A"><text class="m" x="86" y="78" font-size="11">Review · Acme Roofing</text><text class="h" x="86" y="104" font-size="15">Waiting for your review</text>
<rect class="row" x="82" y="120" width="208" height="52" rx="10"/><text class="h" x="94" y="142" font-size="12.5">Roof Repair vs Replacement</text><text class="m" x="94" y="160" font-size="11">Sent Oct 8</text>
<rect class="row" x="82" y="182" width="208" height="52" rx="10"/><text class="h" x="94" y="204" font-size="12.5">5 Signs of Hail Damage</text><text class="m" x="94" y="222" font-size="11">Sent Oct 8</text>
<text class="h" x="86" y="276" font-size="15">Upcoming</text>
<rect class="row" x="82" y="292" width="208" height="52" rx="10"/><text class="h" x="94" y="314" font-size="12.5">Gutter Cleaning Checklist</text><text class="m" x="94" y="332" font-size="11">Publishes Oct 14</text>
</g>
<g class="B"><g class="scroll"><text class="h" x="86" y="90" font-size="16">Roof Repair vs</text><text class="h" x="86" y="110" font-size="16">Replacement</text>
<rect class="ln" x="86" y="130" width="200" height="6" rx="3"/>
<rect class="ln" x="86" y="142" width="190" height="6" rx="3"/>
<rect class="ln" x="86" y="154" width="204" height="6" rx="3"/>
<rect class="ln" x="86" y="166" width="120" height="6" rx="3"/>
<rect class="ln" x="86" y="188" width="120" height="9" rx="4" style="fill:var(--faint)"/>
<rect class="ln" x="86" y="210" width="180" height="6" rx="3"/>
<rect class="ln" x="86" y="222" width="200" height="6" rx="3"/>
<rect class="ln" x="86" y="234" width="196" height="6" rx="3"/>
<rect class="ln" x="86" y="246" width="150" height="6" rx="3"/>
<rect class="ln" x="86" y="268" width="120" height="9" rx="4" style="fill:var(--faint)"/>
<rect class="ln" x="86" y="290" width="204" height="6" rx="3"/>
<rect class="ln" x="86" y="302" width="170" height="6" rx="3"/>
<rect class="ln" x="86" y="314" width="120" height="6" rx="3"/>
</g>
<rect class="bar" x="81" y="398" width="210" height="64"/><rect class="obtn" x="92" y="410" width="89" height="38" rx="8"/><text class="h" x="136" y="433" font-size="10.5" text-anchor="middle">Request changes</text><rect class="btn" x="191" y="410" width="89" height="38" rx="8"/><text class="btnt" x="236" y="433" font-size="12" text-anchor="middle">Approve</text><circle class="tap" cx="236" cy="429" r="4"/></g>
<g class="C"><text class="m" x="86" y="78" font-size="11">Review · Acme Roofing</text><text class="h" x="86" y="104" font-size="15">Waiting for your review</text><rect class="row" x="82" y="120" width="208" height="52" rx="10"/><text class="h" x="94" y="142" font-size="12.5">5 Signs of Hail Damage</text><text class="m" x="94" y="160" font-size="11">Sent Oct 8</text><text class="h" x="86" y="214" font-size="15">Approved, publishing soon</text><rect class="row" x="82" y="230" width="208" height="52" rx="10" style="stroke:var(--approved-fg)"/><text class="h" x="94" y="252" font-size="12.5">Roof Repair vs Replacement</text><rect x="94" y="260" width="66" height="16" rx="8" style="fill:var(--approved)"/><text x="127" y="272" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--approved-fg)">Approved</text><g class="toastg"><rect class="toast" x="96" y="406" width="180" height="40" rx="10"/><text class="toastt" x="186.0" y="431" font-size="12" text-anchor="middle">Approved. Thanks, Sarah!</text></g></g>
</g>
<circle class="num n0" cx="372" cy="145" r="14"/><text class="numt t0" x="372" y="150" text-anchor="middle">1</text><text class="k0" x="398" y="150" font-size="17">Open the private link</text><text class="capn" x="398" y="174">No account, no password. Works on any phone.</text>
<circle class="num n1" cx="372" cy="241" r="14"/><text class="numt t1" x="372" y="246" text-anchor="middle">2</text><text class="k1" x="398" y="246" font-size="17">Read it as it will look live</text><text class="capn" x="398" y="270">Headings, lists and links, just like the post.</text>
<circle class="num n2" cx="372" cy="337" r="14"/><text class="numt t2" x="372" y="342" text-anchor="middle">3</text><text class="k2" x="398" y="342" font-size="17">Approve in one tap</text><text class="capn" x="398" y="366">Or ask for changes with a comment.</text>
</svg>