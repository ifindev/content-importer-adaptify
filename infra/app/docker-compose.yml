# The app on a VPS (docs/deploy-vps.md). The deploy job copies this file to
# ~/app, runs it with IMAGE_TAG set to the commit SHA, then records that tag
# in ~/app/.env so later manual `docker compose up -d` runs keep it. nginx on the host
# proxies app.<domain> to the web and api.<domain> to the API.
services:
  api:
    image: ghcr.io/ifindev/content-importer-adaptify-api:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - ./firebase-service-account.json:/run/secrets/firebase.json:ro
    ports:
      # 127.0.0.1 only: Docker's port rules bypass ufw. The web uses http://api:8080.
      - "127.0.0.1:8000:8080"

  web:
    image: ghcr.io/ifindev/content-importer-adaptify-web:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      API_URL: http://api:8080
    ports:
      # 127.0.0.1 only: Docker's port rules bypass ufw.
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
