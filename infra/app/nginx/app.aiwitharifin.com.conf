# Copy to /etc/nginx/sites-available/app.aiwitharifin.com, link it into
# sites-enabled, then run `sudo certbot --nginx -d app.aiwitharifin.com`.
server {
    listen 80;
    server_name app.aiwitharifin.com;
    # Server Actions accept 31 MB (next.config.ts); uploads cap at 30 MB.
    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # The web reads the last X-Forwarded-For entry as the client IP
        # (lib/api-server.ts); this appends the real one.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
