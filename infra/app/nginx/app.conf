# The web app. setup.sh replaces app.example.com with APP_DOMAIN, installs this
# as /etc/nginx/sites-available/<APP_DOMAIN> and runs certbot, which adds HTTPS.
server {
    listen 80;
    server_name app.example.com;
    # Server Actions accept 31 MB (next.config.ts); uploads cap at 30 MB.
    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # The web reads the last X-Forwarded-For entry as the client IP
        # (lib/api-server.ts); this appends the real one.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
