# Production WordPress on the VPS (T-043). nginx + certbot run on the host
# and proxy to 127.0.0.1:8080. Local development uses the root compose file.
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wpuser
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      # 127.0.0.1 only: Docker's port rules bypass ufw.
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # Host cron runs wp-cron.php every minute. The HTTPS line keeps
      # application passwords on behind the nginx proxy. $$ = literal $.
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
        if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    volumes:
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:
