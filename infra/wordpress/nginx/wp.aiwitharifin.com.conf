# Copy to /etc/nginx/sites-available/wp.aiwitharifin.com, then run
# `sudo certbot --nginx -d wp.aiwitharifin.com`; certbot adds the 443 block
# and the HTTP->HTTPS redirect on the server.
server {
    listen 80;
    server_name wp.aiwitharifin.com;
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
